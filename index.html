<title>Rio das Ostras em Movimento</title>
<style>
:root{
  --bg:#0b1220; --panel:#111b2e; --accent:#ff7a1a; --accent2:#18c37d;
  --text:#f4f6fb; --muted:#a9b4c7; --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;overflow:hidden;height:100vh;}
#deck{position:relative;width:100%;height:100vh;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;padding:6vh 6vw;text-align:center;
  background:radial-gradient(1200px 600px at 15% -10%, rgba(255,122,26,.14), transparent 60%),
             radial-gradient(1200px 700px at 100% 110%, rgba(24,195,125,.12), transparent 55%), var(--bg);}
.slide.active{display:flex;}
.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;color:var(--accent);font-weight:700;margin-bottom:14px;}
h1.main-title{font-size:clamp(2.1rem,5vw,4rem);margin:0 0 10px;font-weight:800;letter-spacing:-.01em;}
p.tag{color:var(--muted);font-size:clamp(1rem,1.6vw,1.3rem);max-width:760px;margin:0 auto;}
.title-slide .brand{font-size:1rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:36px;}
.divider .num{font-size:clamp(4rem,12vw,9rem);font-weight:900;color:var(--line);position:absolute;opacity:.5;}
.divider h2{font-size:clamp(2.6rem,7vw,5.5rem);font-weight:900;margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.divider p{color:var(--muted);font-size:1.15rem;margin-top:14px;}
.content{width:100%;max-width:1180px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;}
.content .eyebrow{margin-bottom:0;}
.content h2{font-size:clamp(1.5rem,3.4vw,2.5rem);margin:2px 0 4px;font-weight:800;}
.content .subtitle{color:var(--muted);font-size:clamp(.95rem,1.5vw,1.15rem);max-width:900px;margin:0 auto 6px;line-height:1.5;}
.media-grid{display:grid;gap:14px;width:100%;grid-auto-rows:1fr;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-height:56vh;}
.media-grid.single{grid-template-columns:minmax(280px,560px);justify-content:center;max-height:60vh;}
.media-item{position:relative;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);}
.media-item img, .media-item video{width:100%;height:100%;object-fit:cover;display:block;background:#000;min-height:160px;max-height:56vh;}
.media-item.video::before{content:"▶";position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;pointer-events:none;}
/* nav */
#nav{position:fixed;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;z-index:50;}
#nav button{background:var(--panel);border:1px solid var(--line);color:var(--text);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:.15s;}
#nav button:hover{background:var(--accent);border-color:var(--accent);}
#counter{color:var(--muted);font-size:.9rem;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:60;transition:width .25s ease;}
#sectiontag{position:fixed;top:18px;left:24px;color:var(--muted);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;z-index:50;}
@media (max-width:700px){
  .content{gap:10px;}
  .media-grid{max-height:40vh;}
  .media-item img,.media-item video{max-height:38vh;min-height:110px;}
}
</style>
<div id="progress"></div>
<div id="sectiontag"></div>
<div id="deck"></div>
<div id="nav">
  <button id="prevBtn" aria-label="Anterior">&#10094;</button>
  <span id="counter">1 / 1</span>
  <button id="nextBtn" aria-label="Próximo">&#10095;</button>
</div>
<script>
const SLIDES = [{"type": "title"}, {"type": "divider", "section": "Projetos", "label": "Projetos", "desc": "Grandes eventos esportivos realizados pela cidade"}, {"section": "Projetos", "code": "p01", "title": "Follow the Future", "subtitle": "Fórum de Beach Tennis — com o multicampeão mundial (90 títulos) Alessandro Calbucci", "photos": [], "videos": [{"src": "media/p01/video_1.mp4", "poster": "media/p01/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p02", "title": "Rio das Ostras Run 2025", "subtitle": "Primeira edição, na Lagoa de Iriry", "photos": ["media/p02/photo_1.jpg"], "videos": [{"src": "media/p02/video_1.mp4", "poster": "media/p02/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p03", "title": "Mulheres em Movimento", "subtitle": "Corrida e caminhada do Outubro Rosa — 1.000 participantes", "photos": ["media/p03/photo_1.jpg", "media/p03/photo_2.jpg"], "videos": [{"src": "media/p03/video_1.mp4", "poster": "media/p03/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p04", "title": "Rio das Ostras Bike Fest", "subtitle": "Primeira edição", "photos": [], "videos": [{"src": "media/p04/video_1.mp4", "poster": "media/p04/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p05", "title": "Clínica de Futevôlei", "subtitle": "Com o pentacampeão mundial Anderson Águia", "photos": ["media/p05/photo_1.jpg"], "videos": [{"src": "media/p05/video_1.mp4", "poster": "media/p05/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p06", "title": "TAFC — Team Águia Futevôlei", "subtitle": "A maior competição de futevôlei do planeta, 2025", "photos": ["media/p06/photo_1.jpg"], "videos": [], "type": "content"}, {"section": "Projetos", "code": "p07", "title": "Etapa do TAF 2026", "subtitle": "Nova etapa do Team Águia Futevôlei", "photos": [], "videos": [{"src": "media/p07/video_1.mp4", "poster": "media/p07/video_1_thumb.jpg"}], "type": "content"}, {"section": "Projetos", "code": "p08", "title": "Ostras Summer", "subtitle": "Inscrições abertas — corrida e caminhada na Lagoa de Iriry", "photos": ["media/p08/photo_1.jpg"], "videos": [], "type": "content"}, {"section": "Projetos", "code": "p09", "title": "Rio das Ostras Bike Fest 2026", "subtitle": "Segunda edição", "photos": ["media/p09/photo_1.jpg", "media/p09/photo_2.jpg"], "videos": [{"src": "media/p09/video_1.mp4", "poster": "media/p09/video_1_thumb.jpg"}, {"src": "media/p09/video_2.mp4", "poster": "media/p09/video_2_thumb.jpg"}], "type": "content"}, {"type": "divider", "section": "Esportes", "label": "Esportes", "desc": "Projetos sociais e esportivos que movimentam Rio das Ostras"}, {"section": "Esportes", "code": "e01", "title": "Projeto Direction One", "subtitle": "Parque Zabulão — Taekwondo, Boxe, Muay Thai, Jiu-Jítsu e Kickboxing só para mulheres. 250 pessoas entre crianças, jovens e adultos", "photos": [], "videos": [{"src": "media/e01/video_1.mp4", "poster": "media/e01/video_1_thumb.jpg"}, {"src": "media/e01/video_2.mp4", "poster": "media/e01/video_2_thumb.jpg"}, {"src": "media/e01/video_3.mp4", "poster": "media/e01/video_3_thumb.jpg"}], "type": "content"}, {"section": "Esportes", "code": "e02", "title": "Capoeira Doulos", "subtitle": "Mestre Marileia", "photos": ["media/e02/photo_1.jpg"], "videos": [{"src": "media/e02/video_1.mp4", "poster": "media/e02/video_1_thumb.jpg"}, {"src": "media/e02/video_2.mp4", "poster": "media/e02/video_2_thumb.jpg"}], "type": "content"}, {"section": "Esportes", "code": "e03", "title": "Projeto Anda Rio das Ostras", "subtitle": "Professor Marcelo", "photos": ["media/e03/photo_1.jpg", "media/e03/photo_2.jpg"], "videos": [], "type": "content"}, {"section": "Esportes", "code": "e04", "title": "Vôlei com Paula Pequeno", "subtitle": "Projeto Esporte Ativo — campeã mundial Paula Pequeno, no Colégio Abdala e no Colégio Cidade Praiana", "photos": ["media/e04/photo_1.jpg", "media/e04/photo_2.jpg", "media/e04/photo_3.jpg", "media/e04/photo_4.jpg"], "videos": [], "type": "content"}, {"section": "Esportes", "code": "e05", "title": "Vôlei de Praia", "subtitle": "Praia do Abricó", "photos": ["media/e05/photo_1.jpg", "media/e05/photo_2.jpg", "media/e05/photo_3.jpg"], "videos": [{"src": "media/e05/video_1.mp4", "poster": "media/e05/video_1_thumb.jpg"}, {"src": "media/e05/video_2.mp4", "poster": "media/e05/video_2_thumb.jpg"}], "type": "content"}, {"section": "Esportes", "code": "e06", "title": "Projeto Jiu-Jítsu", "subtitle": "Projeto Esporte Ativo — Igreja Nova Esperança", "photos": ["media/e06/photo_1.jpg", "media/e06/photo_2.jpg", "media/e06/photo_3.jpg"], "videos": [], "type": "content"}, {"section": "Esportes", "code": "e07", "title": "Campeonato de Futebol Veterano 45+", "subtitle": "Somente para jogadores de Rio das Ostras", "photos": ["media/e07/photo_1.jpg", "media/e07/photo_2.jpg", "media/e07/photo_3.jpg"], "videos": [], "type": "content"}, {"section": "Esportes", "code": "e08", "title": "Inauguração do Campo Society", "subtitle": "Âncora", "photos": [], "videos": [{"src": "media/e08/video_1.mp4", "poster": "media/e08/video_1_thumb.jpg"}, {"src": "media/e08/video_2.mp4", "poster": "media/e08/video_2_thumb.jpg"}, {"src": "media/e08/video_3.mp4", "poster": "media/e08/video_3_thumb.jpg"}, {"src": "media/e08/video_4.mp4", "poster": "media/e08/video_4_thumb.jpg"}], "type": "content"}];

const deck = document.getElementById('deck');
let current = 0;
const total = SLIDES.length;
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const sectiontag = document.getElementById('sectiontag');

function buildSlideEl(s){
  const el = document.createElement('div');
  el.className = 'slide active';
  if (s.type === 'title') {
    el.classList.add('title-slide');
    el.innerHTML = `
      <div class="eyebrow">Rio das Ostras</div>
      <h1 class="main-title">Rio das Ostras em Movimento</h1>
      <p class="tag">Projetos e ações esportivas realizadas na cidade</p>
      <div class="brand">Secretaria de Esporte e Lazer</div>`;
  } else if (s.type === 'divider') {
    el.classList.add('divider');
    el.innerHTML = `<h2>${s.label}</h2><p>${s.desc}</p>`;
  } else {
    let media = '';
    const totalItems = s.photos.length + s.videos.length;
    const gridClass = totalItems === 1 ? 'media-grid single' : 'media-grid';
    media += `<div class="${gridClass}">`;
    s.photos.forEach(p => {
      media += `<div class="media-item"><img src="${p}" alt=""></div>`;
    });
    s.videos.forEach(v => {
      media += `<div class="media-item video"><video controls preload="metadata" poster="${v.poster}" src="${v.src}"></video></div>`;
    });
    media += `</div>`;
    el.classList.add('content');
    el.innerHTML = `
      <div class="eyebrow">${s.section}</div>
      <h2>${s.title}</h2>
      <div class="subtitle">${s.subtitle}</div>
      ${media}`;
  }
  return el;
}

function render(){
  deck.innerHTML = '';
  const s = SLIDES[current];
  deck.appendChild(buildSlideEl(s));
  counter.textContent = (current+1) + ' / ' + total;
  progress.style.width = ((current+1)/total*100) + '%';
  sectiontag.textContent = s.section ? s.section : (s.type === 'title' ? '' : (s.label || ''));
}

function show(idx){
  current = (idx + total) % total;
  render();
}

document.getElementById('prevBtn').addEventListener('click', () => show(current-1));
document.getElementById('nextBtn').addEventListener('click', () => show(current+1));
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(current+1);
  if (e.key === 'ArrowLeft') show(current-1);
});
let touchX = null;
window.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
window.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx > 50) show(current-1);
  if (dx < -50) show(current+1);
  touchX = null;
});
render();
</script>
